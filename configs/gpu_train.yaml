seed: 42
precision: "bfloat16"

model:
  context_len: 64
  num_layers: 6
  num_heads: 8
  emb_dim: 256
  mlp_dim: 1024
  pos_emb_type: "sinusoidal"

data:
  max_depth: 3
  float_precision: 1
  enabled_ops: ["+", "-", "*", "/", "^", "sin", "cos", "tan", "log", "ln", "exp", "sqrt", "abs"]
  val_size: 1000
  test_size: 1000

training:
  total_steps: 50000
  warmup_steps: 2000
  learning_rate: 0.0003
  batch_size: 128
  max_grad_norm: 1.0
  weight_decay: 0.01
  eval_interval: 1000
  save_interval: 5000
  log_interval: 100
  checkpoint_dir: "./checkpoints_gpu"
  accuracy_epsilon: 0.01

curriculum:
  enabled: true
  ema_alpha: 0.1
  temperature: 0.5
  floor_prob: 0.005
  overfit_ratio: 3.0
  overfit_train_threshold: 0.15
  overfit_decay: 0.1
  update_interval: 500
